<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPlanner ✈️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; margin: 0; background: #f8fafc; }
    #google-map { height: 400px; z-index: 0; }
    @media (max-width: 640px) { #google-map { height: 260px; } }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .place-card { transition: all 0.15s; }
    .tab-btn { transition: all 0.2s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
  </style>
  <script>window.initGoogleMaps = () => { window.__gmapsLoaded = true; window.dispatchEvent(new Event('google-maps-ready')); };</script>
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCwyu_2V68PD2ueO0P5FcOTJPAxdtgOjv4&callback=initGoogleMaps"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ── 상수 ── */
    const CAT = {
      쇼핑: { icon:'🛍️', bg:'bg-pink-50',   text:'text-pink-600',   border:'border-pink-200' },
      맛집: { icon:'🍜', bg:'bg-orange-50', text:'text-orange-600', border:'border-orange-200' },
      관광: { icon:'🗺️', bg:'bg-sky-50',    text:'text-sky-600',    border:'border-sky-200' },
      교통: { icon:'✈️', bg:'bg-violet-50', text:'text-violet-600', border:'border-violet-200' },
      숙소: { icon:'🏨', bg:'bg-emerald-50',text:'text-emerald-600',border:'border-emerald-200' },
      카페: { icon:'☕', bg:'bg-amber-50',  text:'text-amber-600',  border:'border-amber-200' },
    };

    const GRAD_POOL = [
      { grad:'from-violet-500 to-purple-600', hex:'#8B5CF6' },
      { grad:'from-pink-500 to-rose-500',     hex:'#EC4899' },
      { grad:'from-blue-500 to-indigo-500',   hex:'#3B82F6' },
      { grad:'from-amber-500 to-orange-500',  hex:'#F59E0B' },
      { grad:'from-emerald-500 to-teal-500',  hex:'#10B981' },
    ];

    const COLOR_OPTIONS = [
      '#EC4899','#8B5CF6','#3B82F6','#F59E0B','#10B981','#EF4444','#F97316','#06B6D4',
    ];
    const EMOJI_OPTIONS = ['✈️','🌸','🗼','🎌','🌊','🏔️','🏙️','🎡','🛫','🌴','🍜','🛍️'];

    /* ── 유틸 ── */
    function compressImage(file, maxWidth=1200, quality=0.82) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    function hexToGrad(hex) {
      const found = GRAD_POOL.find(g => g.hex === hex);
      return found ? found.grad : 'from-pink-500 to-rose-500';
    }
    function formatDateRange(start, end) {
      if (!start) return '';
      const s = start.replace(/-/g, '. ');
      const e = end ? ' ~ ' + end.replace(/-/g, '. ') : '';
      return s + e;
    }
    function calcNights(start, end) {
      if (!start || !end) return null;
      const diff = (new Date(end) - new Date(start)) / 86400000;
      return diff > 0 ? `${diff}박 ${diff+1}일` : null;
    }

    /* ── 공통 컴포넌트 ── */
    function CatBadge({ cat }) {
      const c = CAT[cat];
      if (!c) return <span className="inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-full border bg-gray-50 text-gray-500 border-gray-200">{cat}</span>;
      return (
        <span className={`inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full border ${c.bg} ${c.text} ${c.border} whitespace-nowrap`}>
          {c.icon} {cat}
        </span>
      );
    }

    /* ═══════════════════════════════════════════════
       여행 목록 화면 (TripsView)
    ═══════════════════════════════════════════════ */
    function TripsView({ trips, onSelect, onTripCreated }) {
      const [showCreate, setShowCreate] = useState(false);
      const [showArchived, setShowArchived] = useState(false);

      const active   = trips.filter(t => !t.is_archived);
      const archived = trips.filter(t => t.is_archived);

      return (
        <div className="min-h-screen bg-slate-50">
          <header style={{ background: 'linear-gradient(135deg, #EC4899, #8B5CF6)' }} className="text-white shadow-xl">
            <div className="max-w-2xl mx-auto px-4 py-5">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="font-extrabold text-2xl">✈️ TravelPlanner</h1>
                  <p className="text-white/70 text-sm mt-0.5">나의 여행을 기록하세요</p>
                </div>
                <button
                  onClick={() => setShowCreate(true)}
                  className="bg-white/20 hover:bg-white/30 text-white font-bold px-4 py-2 rounded-xl text-sm transition-all border border-white/30">
                  + 새 여행
                </button>
              </div>
            </div>
          </header>

          <div className="max-w-2xl mx-auto px-4 py-6">
            {active.length === 0 && (
              <div className="text-center py-20">
                <div className="text-6xl mb-4">🗺️</div>
                <p className="text-gray-500 font-medium mb-2">아직 여행이 없어요</p>
                <p className="text-gray-400 text-sm mb-6">첫 번째 여행을 만들어보세요!</p>
                <button onClick={() => setShowCreate(true)}
                  className="bg-gradient-to-r from-pink-500 to-violet-500 text-white font-bold px-6 py-3 rounded-xl text-sm shadow-lg hover:scale-105 transition-transform">
                  ✈️ 첫 여행 만들기
                </button>
              </div>
            )}

            <div className="space-y-3">
              {active.map(trip => (
                <TripCard key={trip.id} trip={trip} onClick={() => onSelect(trip.id)} />
              ))}
            </div>

            {archived.length > 0 && (
              <div className="mt-6">
                <button onClick={() => setShowArchived(v => !v)}
                  className="flex items-center gap-2 text-sm text-gray-400 font-medium mb-3 hover:text-gray-600 transition-colors">
                  <span>{showArchived ? '▼' : '▶'}</span>
                  보관된 여행 {archived.length}개
                </button>
                {showArchived && (
                  <div className="space-y-3 opacity-60">
                    {archived.map(trip => (
                      <TripCard key={trip.id} trip={trip} onClick={() => onSelect(trip.id)} archived />
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          {showCreate && (
            <CreateTripModal onClose={() => setShowCreate(false)} onCreated={t => { onTripCreated(t); setShowCreate(false); }} />
          )}
        </div>
      );
    }

    function TripCard({ trip, onClick, archived }) {
      const grad = hexToGrad(trip.color);
      const nights = calcNights(trip.start_date, trip.end_date);
      return (
        <div onClick={onClick}
          className="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-all cursor-pointer overflow-hidden">
          <div className={`bg-gradient-to-r ${grad} p-4 text-white`}>
            <div className="flex items-start justify-between">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-2xl">{trip.cover_emoji}</span>
                  {archived && <span className="text-xs bg-white/20 px-2 py-0.5 rounded-full font-bold">보관됨</span>}
                </div>
                <h2 className="font-extrabold text-lg leading-tight">{trip.name}</h2>
                {trip.destination && <p className="text-white/80 text-sm mt-0.5">📍 {trip.destination}</p>}
              </div>
              <div className="text-right shrink-0 ml-3">
                {nights && <div className="text-xs bg-white/25 rounded-full px-2.5 py-1 font-bold">{nights}</div>}
              </div>
            </div>
            {(trip.start_date || trip.end_date) && (
              <p className="text-white/70 text-xs mt-2">{formatDateRange(trip.start_date, trip.end_date)}</p>
            )}
          </div>
          <div className="px-4 py-2.5 flex items-center gap-3 text-xs text-gray-500">
            <span>📅 {trip.day_count || 0}일</span>
            <span>📍 {trip.place_count || 0}곳</span>
          </div>
        </div>
      );
    }

    function CreateTripModal({ onClose, onCreated }) {
      const [form, setForm] = useState({
        name: '', destination: '', start_date: '', end_date: '',
        cover_emoji: '✈️', color: '#EC4899',
      });
      const [saving, setSaving] = useState(false);
      const set = (k, v) => setForm(p => ({ ...p, [k]: v }));

      const handleCreate = async () => {
        if (!form.name.trim()) { alert('여행 이름을 입력해주세요.'); return; }
        setSaving(true);
        try {
          const res = await fetch('/api/trips', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form),
          });
          const trip = await res.json();
          onCreated(trip);
        } finally { setSaving(false); }
      };

      const grad = hexToGrad(form.color);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box fade-in" onClick={e => e.stopPropagation()} style={{ maxWidth: 400 }}>
            <div className={`bg-gradient-to-r ${grad} rounded-xl p-4 mb-4 text-white`}>
              <div className="text-2xl mb-1">{form.cover_emoji || '✈️'}</div>
              <div className="font-extrabold text-base">{form.name || '여행 이름'}</div>
              {form.destination && <div className="text-white/80 text-sm mt-0.5">📍 {form.destination}</div>}
            </div>

            <div className="space-y-3">
              <div>
                <label className="text-xs font-bold text-gray-500 mb-1 block">여행 이름 *</label>
                <input value={form.name} onChange={e => set('name', e.target.value)}
                  placeholder="예) 햄삐햄삐 도쿄여행"
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
              </div>
              <div>
                <label className="text-xs font-bold text-gray-500 mb-1 block">목적지</label>
                <input value={form.destination} onChange={e => set('destination', e.target.value)}
                  placeholder="예) 도쿄, 일본"
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-gray-500 mb-1 block">출발일</label>
                  <input type="date" value={form.start_date} onChange={e => set('start_date', e.target.value)}
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-500 mb-1 block">귀국일</label>
                  <input type="date" value={form.end_date} onChange={e => set('end_date', e.target.value)}
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
                </div>
              </div>
              <div>
                <label className="text-xs font-bold text-gray-500 mb-1 block">이모지</label>
                <div className="flex flex-wrap gap-2">
                  {EMOJI_OPTIONS.map(e => (
                    <button key={e} onClick={() => set('cover_emoji', e)}
                      className={`w-9 h-9 rounded-lg text-lg flex items-center justify-center border-2 transition-all
                        ${form.cover_emoji === e ? 'border-blue-400 bg-blue-50 scale-110' : 'border-gray-200 hover:border-gray-300'}`}>
                      {e}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <label className="text-xs font-bold text-gray-500 mb-1 block">테마 컬러</label>
                <div className="flex gap-2">
                  {COLOR_OPTIONS.map(c => (
                    <button key={c} onClick={() => set('color', c)}
                      style={{ background: c }}
                      className={`w-7 h-7 rounded-full border-2 transition-all ${form.color === c ? 'border-gray-800 scale-110' : 'border-transparent'}`} />
                  ))}
                </div>
              </div>
            </div>

            <div className="flex gap-2 mt-5">
              <button onClick={onClose} className="flex-1 py-2.5 rounded-xl text-sm font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">취소</button>
              <button onClick={handleCreate} disabled={saving}
                className={`flex-1 py-2.5 rounded-xl text-sm font-bold text-white transition-all disabled:opacity-60 bg-gradient-to-r ${grad}`}>
                {saving ? '생성 중...' : '✈️ 여행 만들기'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════
       여행 앱 (TripApp)
    ═══════════════════════════════════════════════ */
    function TripApp({ tripId, onBack }) {
      const [trip, setTrip]           = useState(null);
      const [days, setDays]           = useState([]);
      const [members, setMembers]     = useState([]);
      const [checklist, setChecklist] = useState({ cats: [], checks: {} });
      const [tab, setTab]             = useState('home');
      const [loading, setLoading]     = useState(true);

      useEffect(() => {
        setLoading(true);
        Promise.all([
          fetch(`/api/trips/${tripId}`).then(r => r.json()),
          fetch(`/api/trips/${tripId}/days`).then(r => r.json()),
          fetch(`/api/trips/${tripId}/members`).then(r => r.json()),
          fetch(`/api/trips/${tripId}/checklist`).then(r => r.json()),
        ]).then(([t, d, m, cl]) => {
          setTrip(t);
          setDays(Array.isArray(d) ? d : []);
          setMembers(Array.isArray(m) ? m : []);
          setChecklist(cl || { cats: [], checks: {} });
          setLoading(false);
        }).catch(() => setLoading(false));
      }, [tripId]);

      const handleSavePlace = async (placeId, updated) => {
        await fetch(`/api/places/${placeId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updated),
        });
        setDays(prev => prev.map(d => ({
          ...d,
          places: d.places.map(p => p.id === placeId ? { ...p, ...updated } : p),
        })));
      };

      const handleAddPlace = async (dayId, newPlace) => {
        const res = await fetch(`/api/trips/${tripId}/places`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...newPlace, day_id: dayId }),
        });
        const created = await res.json();
        setDays(prev => prev.map(d =>
          d.id === dayId ? { ...d, places: [...d.places, created] } : d
        ));
      };

      const handleDeletePlace = async (placeId, dayId) => {
        await fetch(`/api/places/${placeId}`, { method: 'DELETE' });
        setDays(prev => prev.map(d =>
          d.id === dayId ? { ...d, places: d.places.filter(p => p.id !== placeId) } : d
        ));
      };

      const handleAddDay = async (dayData) => {
        const res = await fetch(`/api/trips/${tripId}/days`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dayData),
        });
        const created = await res.json();
        setDays(prev => [...prev, { ...created, places: [] }]);
      };

      const handleUpdateDay = async (dayId, updates) => {
        await fetch(`/api/trips/${tripId}/days/${dayId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates),
        });
        setDays(prev => prev.map(d => d.id === dayId ? { ...d, ...updates } : d));
      };

      const handleDeleteDay = async (dayId) => {
        await fetch(`/api/trips/${tripId}/days/${dayId}`, { method: 'DELETE' });
        setDays(prev => prev.filter(d => d.id !== dayId));
        if (tab === `day_${dayId}`) setTab('home');
      };

      const handleUpdateTrip = async (updates) => {
        await fetch(`/api/trips/${tripId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates),
        });
        setTrip(prev => ({ ...prev, ...updates }));
      };

      const handleCheck = async (personKey, itemId, checked) => {
        await fetch(`/api/trips/${tripId}/checklist/check`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ person_key: personKey, item_id: itemId, checked: checked ? 1 : 0 }),
        });
        setChecklist(prev => ({
          ...prev,
          checks: {
            ...prev.checks,
            [personKey]: { ...(prev.checks[personKey] || {}), [itemId]: checked },
          },
        }));
      };

      const handleAddMember = async (memberData) => {
        const res = await fetch(`/api/trips/${tripId}/members`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(memberData),
        });
        const created = await res.json();
        setMembers(prev => [...prev, created]);
      };

      const handleDeleteMember = async (memberId) => {
        await fetch(`/api/trips/${tripId}/members/${memberId}`, { method: 'DELETE' });
        setMembers(prev => prev.filter(m => m.id !== memberId));
      };

      const handleUpdateMember = async (memberId, updates) => {
        await fetch(`/api/trips/${tripId}/members/${memberId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates),
        });
        setMembers(prev => prev.map(m => m.id === memberId ? { ...m, ...updates } : m));
      };

      const handleAddCat = async (name) => {
        const res = await fetch(`/api/trips/${tripId}/checklist/cats`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const cat = await res.json();
        setChecklist(prev => ({ ...prev, cats: [...prev.cats, { ...cat, items: [] }] }));
      };

      const handleDeleteCat = async (catId) => {
        await fetch(`/api/checklist/cats/${catId}`, { method: 'DELETE' });
        setChecklist(prev => ({ ...prev, cats: prev.cats.filter(c => c.id !== catId) }));
      };

      const handleAddItem = async (catId, text) => {
        const res = await fetch(`/api/checklist/cats/${catId}/items`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        const item = await res.json();
        setChecklist(prev => ({
          ...prev,
          cats: prev.cats.map(c => c.id === catId ? { ...c, items: [...c.items, item] } : c),
        }));
      };

      const handleDeleteItem = async (catId, itemId) => {
        await fetch(`/api/checklist/items/${itemId}`, { method: 'DELETE' });
        setChecklist(prev => ({
          ...prev,
          cats: prev.cats.map(c => c.id === catId ? { ...c, items: c.items.filter(i => i.id !== itemId) } : c),
        }));
      };

      if (loading) return (
        <div className="min-h-screen flex items-center justify-center bg-slate-50">
          <div className="text-center"><div className="text-4xl mb-3">✈️</div><div className="text-gray-500 text-sm">불러오는 중...</div></div>
        </div>
      );
      if (!trip) return null;

      const grad = hexToGrad(trip.color);
      const TABS = [
        { id: 'home', icon: '🏠', label: '홈' },
        ...days.map(d => ({ id: `day_${d.id}`, icon: d.emoji, label: d.day_label || d.date?.slice(5) || 'Day' })),
        { id: 'checklist', icon: '✅', label: '준비물' },
        { id: 'edit', icon: '✏️', label: '편집' },
      ];

      const allPlaces = days.flatMap(d => d.places || []);

      return (
        <div className="min-h-screen bg-slate-50">
          <header className={`bg-gradient-to-r ${grad} text-white shadow-xl sticky top-0 z-50`}>
            <div className="max-w-3xl mx-auto px-4">
              <div className="flex items-center gap-3 py-3 border-b border-white/20">
                <button onClick={onBack} className="text-white/80 hover:text-white text-xl leading-none shrink-0">←</button>
                <div className="flex-1 min-w-0">
                  <h1 className="font-extrabold text-base sm:text-lg leading-tight truncate">{trip.cover_emoji} {trip.name}</h1>
                  {trip.start_date && <p className="text-white/70 text-xs">{formatDateRange(trip.start_date, trip.end_date)}</p>}
                </div>
              </div>
              <div className="flex gap-0.5 py-2 overflow-x-auto scrollbar-hide">
                {TABS.map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={`tab-btn flex-1 min-w-[44px] flex flex-col items-center py-1.5 px-1 rounded-lg text-xs font-bold transition-all
                      ${tab === t.id ? 'bg-white/30 text-white shadow-sm scale-105' : 'text-white/60 hover:bg-white/15 hover:text-white'}`}>
                    <span className="text-sm">{t.icon}</span>
                    <span className="mt-0.5 text-xs leading-tight text-center" style={{fontSize:'10px'}}>{t.label}</span>
                  </button>
                ))}

    /* ─── Google Maps ─── */
    function TravelMap({ show, days, visibleDays, tripColor }) {
      const mapRef = useRef(null);
      const mapInst = useRef(null);
      const overlaysRef = useRef([]);
      const infoWindowRef = useRef(null);
      const pendingUpdate = useRef(false);
      const daysRef = useRef(days);
      const visibleRef = useRef(visibleDays);
      daysRef.current = days;
      visibleRef.current = visibleDays;

      const makeSvgUrl = (emoji, bgColor, size) => {
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle cx="${size/2}" cy="${size/2}" r="${size/2-1}" fill="${bgColor}" stroke="white" stroke-width="2.5"/>
            <text x="${size/2}" y="${size/2+4}" text-anchor="middle" font-size="${size*0.45}">${emoji}</text>
          </svg>`
        )}`;
      };

      const applyLayers = useCallback((map) => {
        overlaysRef.current.forEach(o => o.setMap(null));
        overlaysRef.current = [];
        if (infoWindowRef.current) infoWindowRef.current.close();
        const infoWindow = infoWindowRef.current || (infoWindowRef.current = new google.maps.InfoWindow());

        daysRef.current.forEach(day => {
          if (!visibleRef.current[day.id]) return;
          const color = day.color || tripColor;
          const withPos = (day.places || []).filter(p => p.pos_lat && p.pos_lng);
          if (withPos.length === 0) return;

          if (withPos.length > 1) {
            const polyline = new google.maps.Polyline({
              path: withPos.map(p => ({ lat: p.pos_lat, lng: p.pos_lng })),
              geodesic: false, strokeColor: color, strokeOpacity: 0.8, strokeWeight: 4, map,
            });
            overlaysRef.current.push(polyline);
          }

          withPos.forEach(place => {
            const catIcon = CAT[place.cat]?.icon || '📍';
            const marker = new google.maps.Marker({
              position: { lat: place.pos_lat, lng: place.pos_lng },
              map,
              icon: { url: makeSvgUrl(catIcon, color, 30), scaledSize: new google.maps.Size(30, 30), anchor: new google.maps.Point(15, 15) },
            });
            marker.addListener('click', () => {
              infoWindow.setContent(`<div style="font-family:'Noto Sans KR',sans-serif;min-width:140px;">
                <div style="font-weight:800;color:${color};font-size:12px;margin-bottom:4px;">${day.day_label || 'Day'} ${day.date ? '· '+day.date.slice(5) : ''}</div>
                <div style="font-weight:700;font-size:14px;margin-bottom:2px;">${place.name}</div>
                ${place.time ? `<div style="color:#6b7280;font-size:12px;">⏰ ${place.time}</div>` : ''}
                ${place.detail ? `<div style="color:#9ca3af;font-size:11px;margin-top:2px;">${place.detail}</div>` : ''}
              </div>`);
              infoWindow.open(map, marker);
            });
            overlaysRef.current.push(marker);
          });
        });

        const allWithPos = daysRef.current.flatMap(d => (d.places || []).filter(p => p.pos_lat && p.pos_lng && visibleRef.current[d.id]));
        if (allWithPos.length > 0) {
          const bounds = new google.maps.LatLngBounds();
          allWithPos.forEach(p => bounds.extend({ lat: p.pos_lat, lng: p.pos_lng }));
          map.fitBounds(bounds, { padding: 60 });
        }
      }, [tripColor]);

      useEffect(() => {
        if (mapInst.current) return;
        const doInit = () => {
          if (mapInst.current || !mapRef.current) return;
          const map = new google.maps.Map(mapRef.current, {
            center: { lat: 35.675, lng: 139.720 }, zoom: 12,
            gestureHandling: 'greedy',
          });
          mapInst.current = map;
          applyLayers(map);
        };
        if (window.google && window.google.maps) { doInit(); }
        else {
          window.addEventListener('google-maps-ready', doInit);
          const poll = setInterval(() => { if (window.google && window.google.maps) { clearInterval(poll); doInit(); } }, 200);
          return () => { window.removeEventListener('google-maps-ready', doInit); clearInterval(poll); };
        }
      }, []);

      useEffect(() => {
        if (!mapInst.current) return;
        if (!show) { pendingUpdate.current = true; return; }
        applyLayers(mapInst.current);
      }, [days, visibleDays]);

      useEffect(() => {
        if (!show || !mapInst.current) return;
        const t = setTimeout(() => {
          google.maps.event.trigger(mapInst.current, 'resize');
          if (pendingUpdate.current) { pendingUpdate.current = false; applyLayers(mapInst.current); }
        }, 50);
        return () => clearTimeout(t);
      }, [show]);

      return <div ref={mapRef} id="google-map" className="w-full" />;
    }

      const color = day.color || tripColor;

        fetch(`/api/places/${place.id}/images`).then(r => r.json())

      const handleUpload = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setUploading(true);
        try {
          const data = await compressImage(file);
          const res = await fetch(`/api/places/${place.id}/images`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, data, trip_id: tripId }),
          });
          const created = await res.json();
          setImages(prev => [...prev, { ...created, data }]);
        } finally { setUploading(false); e.target.value = ''; }
      };

      const handleDeleteImage = async (imgId) => {
        if (!confirm('이미지를 삭제할까요?')) return;
        await fetch(`/api/images/${imgId}`, { method: 'DELETE' });
        setImages(prev => prev.filter(i => i.id !== imgId));

      const handleSave = async () => {
        if (!form.name.trim()) { alert('장소명을 입력해주세요.'); return; }

          await onSave(place.id, { ...place, ...form });

          setEditMode(false);

      const url = `https://www.google.com/maps/search/${encodeURIComponent(place.map || place.name)}`;

    /* ─── ChecklistView ─── */
    function ChecklistView({ trip, members, checklist, onCheck, onAddMember, onDeleteMember, onUpdateMember, onAddCat, onDeleteCat, onAddItem, onDeleteItem }) {
      const [editMode, setEditMode] = useState(false);
      const [newCatName, setNewCatName] = useState('');
      const [addingTo, setAddingTo] = useState(null);
      const [newItemText, setNewItemText] = useState('');
      const [newMemberName, setNewMemberName] = useState('');

      const { cats, checks } = checklist;
      const totalItems = cats.reduce((s, c) => s + c.items.length, 0);

      const GRAD_POOL_CL = [
        { grad:'from-violet-500 to-purple-600', hex:'#8B5CF6', active:'bg-violet-500 border-violet-500', hover:'group-hover:border-violet-400' },
        { grad:'from-pink-500 to-rose-500',     hex:'#EC4899', active:'bg-pink-500 border-pink-500',     hover:'group-hover:border-pink-400' },
        { grad:'from-blue-500 to-indigo-500',   hex:'#3B82F6', active:'bg-blue-500 border-blue-500',     hover:'group-hover:border-blue-400' },
        { grad:'from-amber-500 to-orange-500',  hex:'#F59E0B', active:'bg-amber-500 border-amber-500',   hover:'group-hover:border-amber-400' },
        { grad:'from-emerald-500 to-teal-500',  hex:'#10B981', active:'bg-emerald-500 border-emerald-500', hover:'group-hover:border-emerald-400' },
      ];

      const gridCls = members.length <= 1 ? 'grid-cols-1' : members.length === 2 ? 'grid-cols-2' : members.length === 3 ? 'grid-cols-3' : 'grid-cols-2 sm:grid-cols-4';

      const handleAddMember = async () => {
        const name = newMemberName.trim(); if (!name) return;
        const idx = members.length;
        const style = GRAD_POOL_CL[idx % GRAD_POOL_CL.length];
        const emojis = ['🧡','💚','💙','💛','🩷','💜'];
        await onAddMember({ person_key: name, emoji: emojis[idx % emojis.length], color_hex: style.hex, color_grad: style.grad });
        setNewMemberName('');
      };

      return (
        <div className="fade-in pb-24 pt-4 px-3">
          <div className="max-w-2xl mx-auto">
            <div className="flex items-center justify-between mb-3">
              <p className="text-xs text-gray-400">{editMode ? '멤버·카테고리·항목을 편집하세요' : '각자 체크하며 준비해요 ✈️'}</p>
              <button onClick={() => setEditMode(v => !v)}
                className={`text-xs font-bold px-3 py-1.5 rounded-lg border transition-all
                  ${editMode ? 'bg-blue-500 text-white border-blue-500' : 'bg-white text-gray-500 border-gray-200 hover:border-blue-300'}`}>
                {editMode ? '✅ 완료' : '✏️ 편집'}
              </button>
            </div>

            {editMode && (
              <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden mb-4">
                <div className="px-3 py-2 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
                  <span className="font-bold text-gray-700 text-sm">👥 여행 멤버</span>
                </div>
                <div className="p-3 space-y-2">
                  {members.map((m, i) => (
                    <div key={m.id} className="flex items-center gap-2">
                      <div className="w-3 h-3 rounded-full shrink-0" style={{ background: m.color_hex }} />
                      <span className="text-base shrink-0">{m.emoji}</span>
                      <span className="flex-1 text-sm font-medium text-gray-700">{m.person_key}</span>
                      <button onClick={() => { if (confirm(`'${m.person_key}'를 삭제할까요?`)) onDeleteMember(m.id); }}
                        className="text-xs text-red-300 hover:text-red-500 px-2 py-1 rounded transition-all">✕</button>
                    </div>
                  ))}
                  <div className="flex gap-2 mt-1">
                    <input value={newMemberName} onChange={e => setNewMemberName(e.target.value)}
                      onKeyDown={e => { if (e.key==='Enter') handleAddMember(); }}
                      placeholder="멤버 이름"
                      className="flex-1 text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-300" />
                    <button onClick={handleAddMember} className="text-xs font-bold bg-blue-500 text-white px-3 py-1.5 rounded-lg">추가</button>
                  </div>
                </div>
              </div>
            )}

            {!editMode && members.length > 0 && (
              <div className={`grid ${gridCls} gap-2 mb-4`}>
                {members.map((m, i) => {
                  const style = GRAD_POOL_CL[i % GRAD_POOL_CL.length];
                  const done = cats.reduce((s, c) => s + c.items.filter(it => checks[m.person_key] && checks[m.person_key][it.id]).length, 0);
                  const pct = totalItems > 0 ? Math.round((done / totalItems) * 100) : 0;
                  return (
                    <div key={m.id} className="bg-white rounded-xl border border-gray-100 shadow-sm p-3">
                      <div className="flex items-center justify-between mb-1.5">
                        <span className="font-extrabold text-gray-700 text-sm truncate">{m.emoji} {m.person_key}</span>
                        <span className="font-extrabold text-sm shrink-0 ml-1" style={{ color: m.color_hex }}>{pct}%</span>
                      </div>
                      <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                        <div className={`bg-gradient-to-r ${style.grad} h-2 rounded-full transition-all duration-500`} style={{ width: `${pct}%` }} />
                      </div>
                      <div className="text-xs text-gray-400 mt-1">{done}/{totalItems} 완료</div>
                      {done === totalItems && totalItems > 0 && <div className="text-xs font-bold mt-1 animate-bounce" style={{ color: m.color_hex }}>🎉 준비 완료!</div>}
                    </div>
                  );
                })}
              </div>
            )}

            {cats.map(c => (
              <div key={c.id} className="mb-3">
                {editMode ? (
                  <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                    <div className="flex items-center justify-between px-3 py-2 bg-gray-50 border-b border-gray-100">
                      <span className="font-bold text-gray-700 text-sm">{c.name}</span>
                      <button onClick={() => { if (confirm(`'${c.name}' 카테고리를 삭제할까요?`)) onDeleteCat(c.id); }}
                        className="text-xs text-red-400 hover:text-red-600 font-bold px-2 py-0.5 rounded hover:bg-red-50">🗑️ 삭제</button>
                    </div>
                    <div className="p-2 space-y-1">
                      {c.items.map((item) => (
                        <div key={item.id} className="flex items-center gap-2">
                          <span className="flex-1 text-sm text-gray-700 py-0.5">{item.text}</span>
                          <button onClick={() => onDeleteItem(c.id, item.id)}
                            className="w-5 h-5 flex items-center justify-center text-red-300 hover:text-red-500 rounded text-xs">✕</button>
                        </div>
                      ))}
                      {addingTo === c.id ? (
                        <div className="flex gap-1.5 mt-1.5">
                          <input autoFocus value={newItemText} onChange={e => setNewItemText(e.target.value)}
                            onKeyDown={e => {
                              if (e.key==='Enter') { onAddItem(c.id, newItemText); setNewItemText(''); setAddingTo(null); }
                              if (e.key==='Escape') { setAddingTo(null); setNewItemText(''); }
                            }}
                            placeholder="항목 입력 후 Enter"
                            className="flex-1 text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-300" />
                          <button onClick={() => { onAddItem(c.id, newItemText); setNewItemText(''); setAddingTo(null); }}
                            className="text-xs font-bold bg-blue-500 text-white px-2.5 py-1.5 rounded-lg">추가</button>
                          <button onClick={() => { setAddingTo(null); setNewItemText(''); }}
                            className="text-xs text-gray-400 px-1.5">✕</button>
                        </div>
                      ) : (
                        <button onClick={() => { setAddingTo(c.id); setNewItemText(''); }}
                          className="w-full text-xs text-blue-400 hover:text-blue-600 py-1.5 border border-dashed border-blue-200 rounded-lg hover:border-blue-400 transition-all mt-1">+ 항목 추가</button>
                      )}
                    </div>
                  </div>
                ) : (
                  <>
                    <h3 className="font-bold text-gray-600 text-xs mb-1.5 px-1">{c.name}</h3>
                    <div className={`grid ${gridCls} gap-2`}>
                      {members.map((m, i) => {
                        const style = GRAD_POOL_CL[i % GRAD_POOL_CL.length];
                        return (
                          <div key={m.id} className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                            <div className={`bg-gradient-to-r ${style.grad} text-white text-xs font-extrabold px-2 py-1.5 text-center truncate`}>
                              {m.emoji} {m.person_key}
                            </div>
                            <div className="p-2 space-y-1.5">
                              {c.items.map(item => {
                                const on = !!(checks[m.person_key] && checks[m.person_key][item.id]);
                                return (
                                  <label key={item.id} className="flex items-start gap-1.5 cursor-pointer">
                                    <button onClick={() => onCheck(m.person_key, item.id, !on)}
                                      className={`w-4 h-4 rounded border-2 flex items-center justify-center shrink-0 mt-0.5 transition-all ${on ? style.active : `border-gray-300 ${style.hover}`}`}>
                                      {on && <span className="text-white font-extrabold" style={{fontSize:'9px'}}>✓</span>}
                                    </button>
                                    <span className={`text-xs leading-snug transition-all ${on ? 'text-gray-300 line-through' : 'text-gray-600'}`}>{item.text}</span>
                                  </label>
                                );
                              })}
                              {c.items.length === 0 && <p className="text-xs text-gray-300 text-center py-1">항목 없음</p>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </>
                )}
              </div>
            ))}

            {editMode && (
              <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-3 mb-3">
                <p className="text-xs font-bold text-gray-500 mb-2">➕ 새 카테고리</p>
                <div className="flex gap-2">
                  <input value={newCatName} onChange={e => setNewCatName(e.target.value)}
                    onKeyDown={e => { if (e.key==='Enter') { onAddCat(newCatName); setNewCatName(''); } }}
                    placeholder="카테고리 이름"
                    className="flex-1 text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-300" />
                  <button onClick={() => { onAddCat(newCatName); setNewCatName(''); }}
                    className="text-xs font-bold bg-blue-500 text-white px-3 py-2 rounded-lg whitespace-nowrap">추가</button>
                </div>
              </div>
            )}

            {members.length === 0 && !editMode && (
              <div className="text-center py-8 text-gray-400">
                <div className="text-4xl mb-2">👥</div>
                <p className="text-sm">편집 버튼을 눌러 멤버를 추가하세요</p>
              </div>
            )}
          </div>
        </div>
      );
    }

              <div className="flex items-center justify-between px-4 py-3 border-b border-gray-100 bg-gray-50">
                <span className="font-bold text-gray-700 text-sm">📅 날짜 관리</span>
                <button onClick={() => setShowAddDay(v => !v)}
                  className="text-xs font-bold bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg border border-blue-100 transition-all">
                  + 날짜 추가
                </button>
              </div>

              {showAddDay && (
                <div className="p-3 bg-blue-50 border-b border-blue-100 space-y-2">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-bold text-gray-500 mb-1 block">날짜</label>
                      <input type="date" value={dayForm.date} onChange={e => setDF('date', e.target.value)}
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none bg-white" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-gray-500 mb-1 block">라벨 (예: Day 1)</label>
                      <input value={dayForm.day_label} onChange={e => setDF('day_label', e.target.value)}
                        placeholder="Day 1"
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none bg-white" />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-500 mb-1 block">테마</label>
                    <input value={dayForm.theme} onChange={e => setDF('theme', e.target.value)}
                      placeholder="예) 긴자 & 롯폰기"
                      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none bg-white" />
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="flex-1">
                      <label className="text-xs font-bold text-gray-500 mb-1 block">이모지</label>
                      <div className="flex flex-wrap gap-1.5">
                        {['📅','✈️','🌸','🌃','🛍️','🍜','🗺️','🏠'].map(e => (
                          <button key={e} onClick={() => setDF('emoji', e)}
                            className={`w-8 h-8 rounded-lg text-base flex items-center justify-center border-2 transition-all ${dayForm.emoji===e ? 'border-blue-400 bg-blue-50' : 'border-gray-200 bg-white'}`}>{e}</button>
                        ))}
                      </div>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-gray-500 mb-1 block">컬러</label>
                      <div className="flex flex-wrap gap-1.5">
                        {COLOR_OPTIONS.slice(0,4).map(c => (
                          <button key={c} onClick={() => setDF('color', c)}
                            style={{ background: c }}
                            className={`w-7 h-7 rounded-full border-2 transition-all ${dayForm.color===c ? 'border-gray-800 scale-110' : 'border-transparent'}`} />
                        ))}
                      </div>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setShowAddDay(false)}
                      className="flex-1 py-2 rounded-lg text-sm font-bold bg-white text-gray-600 border border-gray-200">취소</button>
                    <button onClick={async () => {
                      await onAddDay({ ...dayForm, sort_order: days.length });
                      setShowAddDay(false);
                      setDayForm({ date:'', day_label:'', theme:'', emoji:'📅', color:'' });
                    }} className={`flex-1 py-2 rounded-lg text-sm font-bold text-white bg-gradient-to-r ${grad}`}>추가</button>
                  </div>
                </div>
              )}

              <div className="divide-y divide-gray-50">
                {days.length === 0 && <p className="text-center text-gray-400 text-sm py-6">날짜를 추가해보세요</p>}
                {days.map(d => {
                  const dColor = d.color || trip.color;
                  return (
                    <div key={d.id} className="p-3">
                      <div className="flex items-center gap-3 mb-2">
                        <span className="text-xl">{d.emoji}</span>
                        <div className="flex-1 min-w-0">
                          <div className="font-bold text-gray-800 text-sm">{d.day_label || 'Day'} {d.date ? `· ${d.date}` : ''}</div>
                          {d.theme && <div className="text-xs text-gray-500">{d.theme}</div>}
                        </div>
                        <button onClick={() => { if (confirm(`'${d.day_label || d.date}' 날짜를 삭제할까요? 해당 날짜의 장소도 삭제됩니다.`)) onDeleteDay(d.id); }}
                          className="text-xs text-red-400 hover:text-red-600 px-2 py-1 rounded hover:bg-red-50 transition-all">🗑️</button>
                      </div>
                      <div className="space-y-1.5 pl-2">
                        {(d.places || []).map(p => (
                          <div key={p.id} className="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2">
                            <span className="text-xs text-gray-400 shrink-0 w-10">{p.time}</span>
                            <span className="flex-1 font-medium text-gray-700 text-sm truncate">{p.name}</span>
                            <CatBadge cat={p.cat} />
                            <button onClick={() => onDeletePlace(p.id, d.id)}
                              className="text-xs text-red-300 hover:text-red-500 px-1 rounded transition-all shrink-0">✕</button>
                          </div>
                        ))}
                        <button onClick={() => setAddingPlaceTo(d.id)}
                          className="w-full py-2 rounded-lg border-2 border-dashed text-xs font-bold transition-all"
                          style={{ borderColor: dColor + '60', color: dColor }}>
                          + 장소 추가
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {addingPlaceTo && (
            <PlaceEditModal
              dayId={addingPlaceTo}
              dayColor={days.find(d => d.id === addingPlaceTo) ? (days.find(d => d.id === addingPlaceTo).color || trip.color) : trip.color}
              onClose={() => setAddingPlaceTo(null)}
              onSave={async (data) => { await onAddPlace(addingPlaceTo, data); setAddingPlaceTo(null); }}
            />
          )}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════
       메인 App
    ═══════════════════════════════════════════════ */
    function App() {
      const [trips, setTrips]             = useState([]);
      const [currentTripId, setCurrentTripId] = useState(null);
      const [loading, setLoading]         = useState(true);

      useEffect(() => {
        fetch('/api/trips').then(r => r.json())
          .then(data => { setTrips(Array.isArray(data) ? data : []); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const handleTripCreated = (trip) => {
        setTrips(prev => [...prev, trip]);
        setCurrentTripId(trip.id);
      };

      if (loading) return (
        <div className="min-h-screen flex items-center justify-center bg-slate-50">
          <div className="text-center"><div className="text-5xl mb-4">✈️</div><div className="text-gray-500 font-medium">TravelPlanner</div></div>
        </div>
      );

      if (currentTripId) return (
        <TripApp
          tripId={currentTripId}
          onBack={() => setCurrentTripId(null)}
        />
      );

      return (
        <TripsView
          trips={trips}
          onSelect={setCurrentTripId}
          onTripCreated={handleTripCreated}
        />
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
